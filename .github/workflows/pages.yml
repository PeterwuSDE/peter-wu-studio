# The production site is https://www.nlstudio.io on Vercel.
# This workflow only publishes a redirect so the legacy GitHub Pages URL
# does not stay online as a duplicate. It does not build the studio site.
# Turning the github.io host off completely is a repository setting
# (Settings → Pages) and cannot be done from this workflow. After Pages is
# disabled, delete this workflow so later pushes do not try to deploy it.

name: Redirect GitHub Pages to production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Add a Pages 404 that uses the same redirect
        run: cp github-pages/index.html github-pages/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: github-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy redirect to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
